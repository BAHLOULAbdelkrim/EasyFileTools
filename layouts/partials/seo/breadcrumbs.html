{{ if and (not .IsHome) (ne .Kind "404") }}
<nav class="seo-breadcrumbs" aria-label="Breadcrumb"><ol>
{{ range .Ancestors.Reverse }}<li><a href="{{ .RelPermalink }}" data-easyfile-navigation data-target-category="{{ .Section }}">{{ if .IsHome }}Home{{ else }}{{ .Title }}{{ end }}</a></li>{{ end }}
<li aria-current="page">{{ .Title }}</li></ol></nav>
{{ end }}
