evaluation_1:
  modeles:
    - nom: "Redmi Note 11"
      positifs:
        - "Écran AMOLED 90 Hz lumineux"
        - "Bonne autonomie batterie 5000 mAh"
        - "Prix attractif pour entrée de gamme"
        - "Design fin et léger"
      negatifs:
        - "Processeur limité pour jeux lourds"
        - "Pas de 5G"
      note: "7,5"
      conclusion: "Smartphone fiable pour un usage quotidien, idéal pour navigation, réseaux sociaux et multimédia léger. À éviter pour les gamers intensifs."

evaluation_2:
  modeles:
    - nom: "Redmi Note 11S"
      positifs:
        - "Capteur photo principal 108 MP"
        - "Écran AMOLED 90 Hz"
        - "Autonomie correcte 5000 mAh"
        - "Prix raisonnable pour performances"
      negatifs:
        - "Processeur limité pour jeux lourds"
        - "Pas de 5G"
      note: "7,8"
      conclusion: "Idéal pour les amateurs de photo et un usage multimédia complet. Convient à ceux qui veulent de belles photos sans dépenser trop."

evaluation_3:
  modeles:
    - nom: "Redmi Note 11 Pro"
      positifs:
        - "Écran AMOLED 120 Hz fluide"
        - "Caméra 108 MP performante"
        - "Charge rapide 67 W"
        - "Autonomie 5000 mAh"
      negatifs:
        - "Pas de 5G"
        - "Poids légèrement élevé"
      note: "8,3"
      conclusion: "Parfait pour multimédia et photo, avec recharge rapide. Convient à tous sauf ceux qui cherchent la 5G."

evaluation_4:
  modeles:
    - nom: "Redmi Note 11 Pro 5G"
      positifs:
        - "Écran AMOLED 120 Hz"
        - "Support 5G"
        - "Caméra 108 MP"
        - "Autonomie 5000 mAh"
      negatifs:
        - "Design similaire aux modèles précédents"
        - "Pas de certification IP élevée"
      note: "8,5"
      conclusion: "Excellent choix pour les utilisateurs recherchant la 5G et la photo. Adapté pour multimédia, réseaux sociaux et navigation rapide."

evaluation_5:
  modeles:
    - nom: "Redmi Note 11 Pro+ 5G"
      positifs:
        - "Charge ultra-rapide 120 W"
        - "Écran AMOLED 120 Hz"
        - "Caméra 108 MP performante"
        - "Support 5G"
      negatifs:
        - "Autonomie légèrement inférieure (4500 mAh)"
        - "Prix plus élevé que les autres modèles"
      note: "8,7"
      conclusion: "Smartphone haut de gamme de la série pour photo, multimédia et recharge ultra-rapide. Convient aux utilisateurs exigeants et pressés."

differences:
  - "**Performance (processeur) :** Snapdragon 680, Helio G96, Snapdragon 695, Dimensity 920 selon modèle"
  - "**Qualité de la photo principale :** 50 MP sur Note 11, 108 MP sur Note 11S et Pro"
  - "**Écran :** 90 Hz AMOLED sur Note 11/11S, 120 Hz AMOLED sur Pro et variantes 5G"
  - "**Connectivité 5G :** seulement sur Note 11 Pro 5G et Pro+ 5G"
  - "**Vitesse de charge :** 33 W sur Note 11/11S, 67 W sur Pro/Pro 5G, 120 W sur Pro+ 5G"

