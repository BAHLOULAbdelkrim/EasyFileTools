evaluation_1:
  modeles:
    - nom: "Xiaomi 12"
      positifs:
        - "Design compact et léger"
        - "Écran AMOLED 120 Hz fluide"
        - "Performances solides Snapdragon 8 Gen 1"
        - "Charge rapide 67 W"
      negatifs:
        - "Autonomie correcte mais pas exceptionnelle"
        - "Pas de charge sans fil"
      note: "8,2"
      conclusion: "Smartphone performant et compact, idéal pour les utilisateurs voulant un flagship puissant sans taille excessive, mais autonomie limitée."

evaluation_2:
  modeles:
    - nom: "Xiaomi 12X"
      positifs:
        - "Prix plus abordable"
        - "Écran AMOLED fluide 120 Hz"
        - "Snapdragon 870 très performant"
        - "Design élégant et léger"
      negatifs:
        - "Pas de charge sans fil"
        - "Autonomie correcte mais moyenne"
      note: "8,0"
      conclusion: "Version plus accessible du Xiaomi 12, adaptée aux utilisateurs recherchant performance et design premium à prix réduit, mais sans extras haut de gamme."

evaluation_3:
  modeles:
    - nom: "Xiaomi 12 Lite"
      positifs:
        - "Très léger et fin"
        - "Écran AMOLED 120 Hz agréable"
        - "Bonne autonomie pour un Lite"
        - "Appareil photo principal 108 MP"
      negatifs:
        - "Processeur milieu de gamme"
        - "Pas de charge sans fil"
      note: "7,8"
      conclusion: "Idéal pour ceux qui veulent un smartphone fin, léger et esthétique avec bonne photo, mais performances inférieures aux modèles haut de gamme."

evaluation_4:
  modeles:
    - nom: "Xiaomi 12T"
      positifs:
        - "Capteur principal 108 MP performant"
        - "Charge ultra rapide 120 W"
        - "Écran AMOLED 120 Hz fluide"
        - "Batterie 5000 mAh solide"
      negatifs:
        - "Pas de charge sans fil"
        - "Poids légèrement supérieur"
      note: "8,5"
      conclusion: "Smartphone équilibré entre performance et autonomie, idéal pour les amateurs de photo et de charge ultra rapide, moins adapté aux petits budgets."

evaluation_5:
  modeles:
    - nom: "Xiaomi 12T Pro"
      positifs:
        - "Capteur principal 200 MP exceptionnel"
        - "Snapdragon 8+ Gen 1 puissant"
        - "Charge ultra rapide 120 W"
        - "Batterie 5000 mAh durable"
      negatifs:
        - "Poids un peu élevé"
        - "Pas de charge sans fil"
      note: "9,0"
      conclusion: "Excellent pour les utilisateurs exigeants en photo et puissance, parfait pour multi-tâches et gaming, mais légèrement lourd pour certains."

evaluation_6:
  modeles:
    - nom: "Xiaomi 12 Pro"
      positifs:
        - "Triple caméra 50 MP de qualité"
        - "Écran AMOLED LTPO WQHD+ 120 Hz"
        - "Charge filaire et sans fil rapide"
        - "Quad haut-parleurs Harman Kardon"
      negatifs:
        - "Prix élevé"
        - "Poids conséquent"
      note: "9,2"
      conclusion: "Le vrai flagship premium, parfait pour les amateurs de photo, multimédia et design, mais coûteux et un peu lourd pour usage quotidien."

differences:
  - "**Processeur et performances :** Snapdragon 8/8+ Gen 1 ou Dimensity 8100"
  - "**Capteur photo principal :** 50 MP, 108 MP ou 200 MP selon modèle"
  - "**Écran :** AMOLED FHD+ ou WQHD+, LTPO ou CrystalRes, taille et technologie variable"
  - "**Charge :** rapide 67 W ou 120 W, charge sans fil uniquement sur Pro"
  - "**Audio :** double stéréo vs quadruple Harman Kardon sur le Pro"

