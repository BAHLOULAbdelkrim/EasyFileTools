evaluation_1:
  modeles:
    - nom: "Redmi Note 15"
      positifs:
        - "Batterie longue durée 6000 mAh"
        - "Écran AMOLED lumineux et net"
        - "Prix abordable pour un smartphone"
        - "Émetteur infrarouge pratique"
      negatifs:
        - "Pas de fonctionnalités IA avancées"
        - "Processeur limité pour jeux lourds"
      note: "7,5"
      conclusion: "Smartphone abordable, bonne autonomie et écran correct, idéal pour usage quotidien et multimédia léger, moins adapté aux jeux exigeants ou à la photo IA avancée."

evaluation_2:
  modeles:
    - nom: "Redmi Note 15 5G"
      positifs:
        - "Connexion 5G rapide"
        - "Batterie 5520 mAh performante"
        - "Écran AMOLED 6,77\" lumineux"
        - "Lecteur d’empreintes latéral intégré"
      negatifs:
        - "Pas de fonctionnalités IA avancées"
        - "Processeur moyen pour jeux gourmands"
      note: "7,8"
      conclusion: "Bonne option 5G pour un usage quotidien, écran correct et autonomie solide, parfait pour navigation et streaming, moins conseillé pour usage intensif en jeux 3D."

evaluation_3:
  modeles:
    - nom: "Redmi Note 15 Pro"
      positifs:
        - "Caméra principale 200 MP performante"
        - "Assistant créativité IA complet"
        - "Écran AMOLED 6,77\" FHD+"
        - "Grande autonomie 6500 mAh"
      negatifs:
        - "Lecteur d’empreintes sous écran lent"
        - "Poids légèrement élevé"
      note: "8,5"
      conclusion: "Excellente polyvalence photo et multimédia, IA pour créativité utile, idéal pour amateurs de photo et vidéos, moins conseillé pour petits budgets."

evaluation_4:
  modeles:
    - nom: "Redmi Note 15 Pro 5G"
      positifs:
        - "Processeur Dimensity 7400 puissant"
        - "Caméra 200 MP et IA créative"
        - "Écran AMOLED 6,83\" net et fluide"
        - "Autonomie 6580 mAh satisfaisante"
      negatifs:
        - "Poids un peu élevé"
        - "Lecteur d’empreintes sous écran"
      note: "8,7"
      conclusion: "Très bon smartphone 5G avec photo et IA solides, adapté à multimédia et jeux, moins pratique pour usage d’une seule main à cause du poids."

evaluation_5:
  modeles:
    - nom: "Redmi Note 15 Pro+ 5G"
      positifs:
        - "HyperCharge 100 W ultra rapide"
        - "Caméra 200 MP et IA complète"
        - "Écran AMOLED CrystalRes 1.5K"
        - "Performance Snapdragon 7s Gen 4"
      negatifs:
        - "Prix plus élevé que les autres"
        - "Poids conséquent pour un usage quotidien"
      note: "9,2"
      conclusion: "Modèle le plus performant de la série, idéal pour photos, jeux et recharge rapide, destiné aux utilisateurs exigeants, moins recommandé pour petits budgets ou portabilité."

differences:
  - "Performance (processeur et GPU)"
