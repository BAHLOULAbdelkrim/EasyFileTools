cotes:
  haut:
    - "Prise audio 3,5 mm"               # Disponible sur la série standard et Pro / Pro+/5G selon le design de Xiaomi Note series (présent sur tous les modèles) :contentReference[oaicite:1]{index=1}
    - "Émetteur infrarouge (IR blaster)"  # Mentionné pour certains modèles de la série (notamment standard) :contentReference[oaicite:2]{index=2}
    - "Microphone secondaire"             # Présence standard sur la plupart des smartphones modernes (souvent mentionné) :contentReference[oaicite:3]{index=3}
  bas:
    - "Port USB‑C"                        # Présent sur tous les modèles de la série :contentReference[oaicite:4]{index=4}
    - "Microphone principal"              # Composant standard en bas sur les smartphones :contentReference[oaicite:5]{index=5}
    - "Haut‑parleur"                      # Présent sur tous les modèles (mono ou stéréo selon variantes) :contentReference[oaicite:6]{index=6}
  droite:
    - "Boutons volume + / −"              # Présent sur tous les modèles (boutons de volume) :contentReference[oaicite:7]{index=7}
    - "Bouton marche / arrêt"             # Présent sur tous les modèles (souvent avec capteur d’empreintes intégré sur les versions pertinentes) :contentReference[oaicite:8]{index=8}
  gauche:
    - "Tiroir SIM / hybrid SIM + microSD" # La série standard et certains modèles Pro/5G ont un tiroir SIM (avec emplacement hybride pour microSD sur certains) :contentReference[oaicite:9]{index=9}


