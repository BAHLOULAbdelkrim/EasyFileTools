evaluation_1:
  modeles:
    - nom: "Redmi Note 13"
      positifs:
        - "Bonne autonomie batterie 5000 mAh"
        - "Écran AMOLED lumineux et précis"
        - "Prix attractif pour ses performances"
        - "Design fin et léger"
      negatifs:
        - "Processeur moyen pour jeux lourds"
        - "Pas de fonctionnalités IA avancées"
      note: "7,5"
      conclusion: "Smartphone équilibré pour un usage quotidien, réseaux sociaux et multimédia. Idéal pour les budgets modestes, moins recommandé pour gamers exigeants."

evaluation_2:
  modeles:
    - nom: "Redmi Note 13 5G"
      positifs:
        - "Connectivité 5G rapide"
        - "Écran AMOLED 6,67 pouces agréable"
        - "Bonne autonomie batterie"
        - "Design moderne et fin"
      negatifs:
        - "Processeur légèrement limité pour jeux"
        - "Fonctions IA inexistantes"
      note: "7,7"
      conclusion: "Idéal pour les utilisateurs cherchant la 5G et un écran lumineux. Convient au multimédia et navigation, mais moins pour gaming intensif."

evaluation_3:
  modeles:
    - nom: "Redmi Note 13 Pro"
      positifs:
        - "Caméra principale 200 MP excellente"
        - "Fonctions IA photo avancées"
        - "Écran AMOLED 120 Hz fluide"
        - "Autonomie confortable"
      negatifs:
        - "Charge rapide correcte mais pas extrême"
        - "Poids un peu plus élevé"
      note: "8,5"
      conclusion: "Très bon smartphone photo et multimédia avec fonctions IA. Recommandé pour les amateurs de photo et utilisateurs exigeants."

evaluation_4:
  modeles:
    - nom: "Redmi Note 13 Pro 5G"
      positifs:
        - "Connectivité 5G performante"
        - "Caméra 200 MP avec IA"
        - "Écran AMOLED fluide 120 Hz"
        - "Bonne autonomie globale"
      negatifs:
        - "Prix plus élevé que version standard"
        - "Charge rapide correcte mais pas maximale"
      note: "8,7"
      conclusion: "Excellent pour photo et multimédia avec 5G. Convient aux utilisateurs recherchant performance et design moderne, mais budget plus conséquent."

evaluation_5:
  modeles:
    - nom: "Redmi Note 13 Pro+ 5G"
      positifs:
        - "Caméra 200 MP ultra performante"
        - "Charge HyperCharge 120 W très rapide"
        - "Écran CrystalRes AMOLED 1,5K"
        - "Fonctions IA complètes et avancées"
      negatifs:
        - "Prix relativement élevé"
        - "Poids légèrement supérieur"
      note: "9,2"
      conclusion: "Smartphone haut de gamme avec photo et vidéo exceptionnelles, écran net et charge ultra rapide. Idéal pour les utilisateurs exigeants et multimédia intensif."

differences:
  - "**Performance (processeur) :** Snapdragon 685/Dimensity 6080 vs Helio G99/Snapdragon 7s/Dimensity 7200‑Ultra"
