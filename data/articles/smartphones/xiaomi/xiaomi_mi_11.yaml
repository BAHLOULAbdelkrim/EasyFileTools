evaluation_1:
  modeles:
    - nom: "Mi 11"
      positifs:
        - "Écran AMOLED WQHD+ lumineux"
        - "Excellente performance Snapdragon 888"
        - "Caméra arrière polyvalente 108 MP"
        - "Charge rapide filaire et sans fil"
      negatifs:
        - "Pas de slot microSD"
        - "Autonomie moyenne pour usage intensif"
      note: "9,0"
      conclusion: "Smartphone premium avec performances et écran de qualité. Idéal pour utilisateurs exigeants et amateurs de photo et vidéo, moins pour les gros stockeurs."

evaluation_2:
  modeles:
    - nom: "Mi 11i"
      positifs:
        - "Performances Snapdragon 888 solides"
        - "Écran AMOLED 120 Hz fluide"
        - "Caméra principale 108 MP efficace"
        - "Charge rapide 33 W fiable"
      negatifs:
        - "Capteur d’empreintes latéral moins pratique"
        - "Pas de charge sans fil"
      note: "8,5"
      conclusion: "Très bon smartphone performant à prix plus abordable que Mi 11. Convient à la plupart des utilisateurs mais les amateurs de recharge sans fil peuvent hésiter."

evaluation_3:
  modeles:
    - nom: "Mi 11 Lite"
      positifs:
        - "Design ultra-fin et léger"
        - "Écran AMOLED FHD+ agréable"
        - "IA photo efficace pour portraits"
        - "Prix abordable"
      negatifs:
        - "Processeur moins puissant"
        - "Pas de 5G pour cette version"
      note: "7,5"
      conclusion: "Parfait pour ceux qui veulent un smartphone fin, léger et abordable. À éviter pour les utilisateurs exigeants en performance et jeux gourmands."

evaluation_4:
  modeles:
    - nom: "Mi 11 Lite 5G"
      positifs:
        - "Design fin et léger"
        - "Écran AMOLED FHD+ 120 Hz"
        - "IA photo avancée"
        - "Connectivité 5G rapide"
      negatifs:
        - "Autonomie correcte mais pas exceptionnelle"
        - "Processeur moins performant que flagship"
      note: "7,8"
      conclusion: "Bon compromis entre finesse, 5G et IA photo. Convient aux utilisateurs mobiles et réseaux rapides, moins adapté aux gamers intensifs."

evaluation_5:
  modeles:
    - nom: "Mi 11 Ultra"
      positifs:
        - "Caméra arrière exceptionnelle 50 MP"
        - "Écran WQHD+ lumineux et fluide"
        - "Performances Snapdragon 888 puissantes"
        - "Charge rapide filaire et sans fil"
      negatifs:
        - "Très lourd et épais"
        - "Prix élevé"
      note: "9,3"
      conclusion: "Smartphone haut de gamme pour photographes et vidéastes. Performances et écran premium, mais moins pratique pour une utilisation à une main et budget important."

differences:
  - "**Performance :** Snapdragon 888 sur Mi 11, Mi 11i, Mi 11 Ultra ; Snapdragon 732G sur Mi 11 Lite ; Snapdragon 780G sur Mi 11 Lite 5G"
  - "**Caméra principale :** 108 MP Mi 11 / Mi 11i ; 50 MP Mi 11 Ultra ; 64 MP Mi 11 Lite / Lite 5G"
  - "**Écran :** WQHD+ 120 Hz sur Mi 11 / Mi 11 Ultra ; FHD+ 120 Hz sur Mi 11i et Lite 5G ; FHD+ 60 Hz sur Mi 11 Lite"
  - "**Batterie :** 4600 mAh Mi 11, 4520 mAh Mi 11i, 4250 mAh Mi 11 Lite / Lite 5G, 5000 mAh Mi 11 Ultra"

