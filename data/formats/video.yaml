heading: "Video Formats"

intro: "Compare common video containers, understand the codecs they usually carry, and choose the best format for compatibility, compression, web delivery, editing or archiving."

navigation_category: "video"

note:
  title: "Container vs codec:"
  text: "MP4, WebM, MKV, MOV and AVI are containers. The container defines how video, audio, subtitles and metadata are packaged, while the codec controls how the video or audio is compressed. Two MP4 files can therefore have very different quality, size and compatibility depending on whether they use H.264, H.265, AV1 or another codec."

secondary_note:
  title: "Compatibility tip:"
  text: "For maximum compatibility, MP4 with H.264 video and AAC audio remains one of the safest choices. WebM with VP9 or AV1 is excellent for modern web delivery, while MKV is better suited to flexible archives with multiple tracks and subtitles."

quick_choices:
  - label: "Best overall compatibility"
    formats: "MP4 + H.264"

  - label: "Best modern web efficiency"
    formats: "WebM + VP9 / AV1"

  - label: "Multiple audio & subtitle tracks"
    formats: "MKV"

  - label: "Apple / professional editing"
    formats: "MOV"

  - label: "Legacy Windows video"
    formats: "AVI / WMV"

  - label: "Legacy mobile / low bandwidth"
    formats: "3GP"

  - label: "Broadcast / camera streams"
    formats: "TS / M2TS"

formats:

