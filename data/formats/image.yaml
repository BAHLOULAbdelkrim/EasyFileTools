heading: "Image Formats"

intro: "Compare raster and vector image formats by compression, transparency, animation, compatibility and typical use. The best format depends on whether you need photographic quality, lossless graphics, transparency, very small web files or editable vectors."

navigation_category: "images"

quick_choices:
  - label: "Photos & broad compatibility"
    formats: "JPG"
  - label: "Screenshots, UI & lossless graphics"
    formats: "PNG"
  - label: "Modern web images"
    formats: "WebP / AVIF"
  - label: "Transparency"
    formats: "PNG / WebP / AVIF"
  - label: "Simple animation"
    formats: "GIF / WebP"
  - label: "Logos & scalable graphics"
    formats: "SVG"
  - label: "Scanning / print archive"
    formats: "TIFF"

note:
  title: "Conversion is not always neutral"
  text: "Converting a lossy image such as JPG to another lossy format can introduce another generation of compression. Converting to PNG does not restore detail already lost in the source. Keep the original file whenever long-term quality matters."

formats:
  - name: "JPG / JPEG"
    extensions: ".jpg • .jpeg"
    status: "Universal"
    description: "Lossy raster format optimized for photographs and continuous-tone images. It offers excellent compatibility and usually small files, but it does not preserve transparency."
    facts:
      - label: "Compression"
        value: "Lossy"
      - label: "Transparency"
        value: "No"
      - label: "Animation"
        value: "No"
      - label: "Best strength"
        value: "Photos + compatibility"
    best_for: "Photos, email, social sharing and broadly compatible web images"
    note: "Repeated JPG re-encoding can progressively reduce quality."
    action_label: "Convert to / from JPG"
    action_url: "/images/convert-image/"

  - name: "PNG"
    extensions: ".png"
    status: "Lossless"
    description: "Lossless raster format that preserves sharp edges and alpha transparency. It is excellent for interface graphics and screenshots, but photographic files can be much larger than JPG, WebP or AVIF."
    facts:
      - label: "Compression"
        value: "Lossless"
      - label: "Transparency"
        value: "Yes"
      - label: "Animation"
        value: "APNG variant"
      - label: "Best strength"
        value: "Exact pixels + alpha"
    best_for: "Screenshots, logos, diagrams, UI assets and transparent graphics"
    action_label: "Convert to / from PNG"
    action_url: "/images/convert-image/"

  - name: "WebP"
    extensions: ".webp"
    status: "Modern web"
    description: "Modern raster format supporting lossy and lossless compression, transparency and animation. It is a strong general-purpose choice for websites."
    facts:
      - label: "Compression"
        value: "Lossy / Lossless"
      - label: "Transparency"
        value: "Yes"
      - label: "Animation"
        value: "Yes"
      - label: "Best strength"
        value: "Balanced web efficiency"
    best_for: "Websites, product images, thumbnails and mixed photo/graphic workloads"
    action_label: "Convert to / from WebP"
    action_url: "/images/convert-image/"

  - name: "AVIF"
    extensions: ".avif"
    status: "High efficiency"
    description: "AV1-based image format designed for very efficient compression with support for transparency and advanced color. Encoding can be slower and browser-side encoding support is not identical everywhere."
    facts:
      - label: "Compression"
        value: "Lossy / Lossless"
      - label: "Transparency"
        value: "Yes"
      - label: "File size"
        value: "Often very small"
      - label: "Trade-off"
        value: "Slower encoding"
    best_for: "High-quality web delivery when file size matters strongly"
    action_label: "Convert AVIF when supported"
    action_url: "/images/convert-image/"

  - name: "GIF"
    extensions: ".gif"
    status: "Animation"
    description: "Legacy indexed-color format with broad compatibility and simple frame animation. Its 256-color palette makes it inefficient for photographs and rich gradients."
    facts:
      - label: "Compression"
        value: "Lossless indexed"
      - label: "Colors"
        value: "Up to 256 / frame"
      - label: "Transparency"
        value: "1-bit"
      - label: "Animation"
        value: "Yes"
    best_for: "Simple looping animations and compatibility-focused animated graphics"
    note: "FileMorning does not yet expose GIF conversion in Convert Image; a dedicated Image to GIF tool is planned."
    action_label: "Explore Image tools"
    action_url: "/images/"

  - name: "SVG"
    extensions: ".svg"
    status: "Vector"
    description: "XML-based vector format built from paths, shapes and text instead of a fixed pixel grid. It can scale without becoming pixelated when the content is genuinely vector."
    facts:
      - label: "Type"
        value: "Vector"
      - label: "Transparency"
        value: "Yes"
      - label: "Scalable"
        value: "Resolution-independent"
      - label: "Best strength"
        value: "Logos + diagrams"
    best_for: "Logos, icons, diagrams, illustrations and interface assets"
    note: "Photographs are normally better stored as raster images rather than embedded inside SVG."
    action_label: "Convert SVG to raster"
    action_url: "/images/convert-image/"

  - name: "HEIC / HEIF"
    extensions: ".heic • .heif"
    status: "Mobile photo"
    description: "Efficient container family widely used for smartphone photography, especially in Apple ecosystems. It can store high-quality imagery and metadata efficiently, but decoding support is less universal than JPG."
    facts:
      - label: "Compression"
        value: "High efficiency"
      - label: "Quality"
        value: "High"
      - label: "File size"
        value: "Small"
      - label: "Compatibility"
        value: "Less universal"
    best_for: "Phone photo storage and modern capture workflows"
    note: "HEIC/HEIF is not yet accepted by the current browser-side Convert Image engine."
    action_label: "Explore Image tools"
    action_url: "/images/"

  - name: "TIFF"
    extensions: ".tif • .tiff"
    status: "Professional"
    description: "Flexible raster container widely used in scanning, publishing, prepress and archival workflows. TIFF can preserve very high quality but often produces large files and is not a normal web delivery format."
    facts:
      - label: "Compression"
        value: "Lossless / optional"
      - label: "Quality"
        value: "Excellent"
      - label: "File size"
        value: "Large"
      - label: "Web use"
        value: "Poor"
    best_for: "Scanning, print production, masters and professional archives"
    note: "TIFF is not yet accepted by the current browser-side Convert Image engine."
    action_label: "Explore Image tools"
    action_url: "/images/"

  - name: "BMP"
    extensions: ".bmp"
    status: "Legacy bitmap"
    description: "Simple bitmap format associated with Windows. It is easy to decode but usually much larger than compressed modern formats."
    facts:
      - label: "Compression"
        value: "None / limited"
      - label: "Transparency"
        value: "Limited"
      - label: "File size"
        value: "Very large"
      - label: "Modern use"
        value: "Limited"
    best_for: "Legacy applications and simple interchange where BMP is explicitly required"
    action_label: "Convert BMP"
    action_url: "/images/convert-image/"

  - name: "ICO"
    extensions: ".ico"
    status: "Icon container"
    description: "Specialized container that can hold multiple raster icon sizes and bit depths in one file. It is primarily used by desktop applications and website favicons."
    facts:
      - label: "Type"
        value: "Icon container"
      - label: "Transparency"
        value: "Yes"
      - label: "Multiple sizes"
        value: "Yes"
      - label: "Typical use"
        value: "Favicons / app icons"
    best_for: "Windows application icons and compatibility-focused favicons"
    action_label: "Explore Image tools"
    action_url: "/images/"
