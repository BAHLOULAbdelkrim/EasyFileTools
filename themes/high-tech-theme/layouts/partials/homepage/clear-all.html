<div class="clear-all-container">

    <div class="compatible-wrapper">

        <button id="compatibleOpBtn" class="compatible-op" disabled>

            <i data-lucide="settings-2"></i>

            Compatible Operations

            <i data-lucide="settings-2"></i>

        </button>

    </div>


    <!-- CLEAR ALL -->

    <div class="clear-all-wrapper">

        <button id="clearAllBtn" class="shiny-btn" disabled>

            <i data-lucide="trash-2"></i>

            Clear All

        </button>

    </div>


    <!-- OPÉRATIONS COMPATIBLES -->

    <div id="operations-list"></div>


    <!-- CLEAR ALL MODAL -->

    <div id="clearAllModal" class="clear-all-modal hidden">

        <div class="clear-all-box">

            <h3 class="clear-all-title">
                <i data-lucide="triangle-alert"></i>
                Clear all files?
            </h3>

            <p>
                Are you sure you want to remove <strong>all files</strong>?
            </p>

            <div class="clear-all-actions">

                <button
                    type="button"
                    id="clearAllCancel"
                >
                    <i data-lucide="x"></i>
                    Cancel
                </button>

                <button
                    type="button"
                    id="clearAllConfirm"
                >
                    <i data-lucide="check"></i>
                    Confirm
                </button>

            </div>

        </div>

    </div>

</div>
