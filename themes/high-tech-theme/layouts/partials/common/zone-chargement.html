<div
    id="upload-zone-container"
    data-category="{{ .category | default "" }}"
>

    <div id="drop-zone">

        <div class="upload-actions">

            <label
                for="fileInput"
                class="upload-btn"
            >
                <i data-lucide="folder-open"></i>
                Browse
            </label>


            <button
                type="button"
                class="drag-drop"
                id="dragBtn"
            >
                <i data-lucide="upload"></i>
                Drag & drop files here
                <i data-lucide="upload"></i>
            </button>


            <button
                type="button"
                class="upload-btn"
                id="urlBtn"
            >
                <i data-lucide="link"></i>
                From URL
            </button>

        </div>


        <input
            type="file"
            id="fileInput"
            multiple
        >


        <div
            id="urlModal"
            class="url-modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="urlModalTitle"
        >

            <div class="url-box">

                <h3 id="urlModalTitle">
                    Paste file URL
                </h3>


                <label for="urlInput" class="url-input-label">Direct file URL</label>
                <input
                    type="url"
                    id="urlInput"
                    placeholder="https://example.com/file"
                    inputmode="url"
                    autocomplete="off"
                    spellcheck="false"
                    aria-describedby="urlImportWarning"
                >
                <p id="urlImportWarning" class="url-import-warning">
                    Use a direct HTTPS file link. The remote server must allow cross-origin downloads (CORS). Avoid sharing private access tokens in URLs.
                </p>


                <div class="url-actions">

                    <button
                        type="button"
                        id="urlCancel"
                    >
                        <i data-lucide="x"></i>
                        Cancel
                    </button>


                    <button
                        type="button"
                        id="urlAdd"
                    >
                        <i data-lucide="plus"></i>
                        Add
                    </button>

                </div>

            </div>

        </div>


        <p
            id="upload-info"
            class="upload-info"
        ></p>

    </div>

</div>
